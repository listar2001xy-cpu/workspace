; 企业级多环境构建：esp32dev（目标板）+ native（PC 单测）
[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
test_framework = unity
build_flags = -std=gnu++11

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:native]
platform = native
test_ignore = test_embedded
build_flags = -Isrc
build_src_filter = -<*>  ; 不编译 src/（含 Arduino.h），仅跑 test/ 的纯逻辑单测
