; 企业级多环境构建：esp32dev（目标板）+ native（PC 单测）
[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
test_framework = unity
build_flags = -std=gnu++11

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; BLE(Bluedroid)+WiFi 双协议栈 > 1.3MB 默认分区，改用 3MB 应用区（huge_app）
; 注意：huge_app 无 OTA 分区，OTA 里程碑落地时再换自定义双应用区方案
board_build.partitions = huge_app.csv

[env:native]
platform = native
test_ignore = test_embedded
build_flags = -std=gnu++11 -Isrc
build_src_filter = -<*>  ; 不编译 src/（含 Arduino.h），仅跑 test/ 的纯逻辑单测
